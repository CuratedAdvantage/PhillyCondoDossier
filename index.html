<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Building Dossier — The Curated Advantage</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@300;400;500;600&display=swap');

  :root {
    --ink: #1a1410;
    --cream: #f7f3ee;
    --warm-white: #faf8f5;
    --gold: #c4962a;
    --gold-light: #e8c96a;
    --muted: #8a7f74;
    --border: #e0d8cf;
    --tag-bg: #f0ebe4;
    --green: #4a7c59;
    --red: #a0432a;
    --blue: #2a5a8a;
    --card-bg: #ffffff;
    --shadow: 0 2px 12px rgba(26,20,16,0.08);
    --shadow-hover: 0 8px 32px rgba(26,20,16,0.16);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--cream);
    color: var(--ink);
    min-height: 100vh;
  }

  /* HEADER */
  header {
    background: var(--ink);
    padding: 28px 40px 24px;
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 20px;
    flex-wrap: wrap;
    border-bottom: 3px solid var(--gold);
  }

  .logo-block h1 {
    font-family: 'Playfair Display', serif;
    font-size: 2rem;
    color: var(--cream);
    font-weight: 400;
    letter-spacing: 0.01em;
  }

  .logo-block h1 span {
    color: var(--gold);
    font-style: italic;
  }

  .logo-block p {
    font-size: 0.8rem;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.12em;
    margin-top: 4px;
  }

  .logo-sub {
    font-size: 0.78rem !important;
    color: #c8bfb5 !important;
    text-transform: uppercase;
    letter-spacing: 0.14em;
    margin-top: 5px !important;
  }

  .logo-brand {
    font-family: 'Playfair Display', serif;
    font-size: 0.82rem !important;
    color: var(--gold) !important;
    font-style: italic;
    text-transform: none !important;
    letter-spacing: 0.04em !important;
    margin-top: 3px !important;
  }

  .header-stats {
    display: flex;
    gap: 28px;
    align-items: flex-end;
  }

  .stat-pill {
    text-align: right;
  }
  .stat-pill .num {
    font-family: 'Playfair Display', serif;
    font-size: 1.6rem;
    color: var(--gold);
    display: block;
    line-height: 1;
  }
  .stat-pill .label {
    font-size: 0.72rem;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.1em;
  }

  /* CONTROLS */
  .controls-bar {
    background: var(--warm-white);
    border-bottom: 1px solid var(--border);
    padding: 18px 40px;
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
    align-items: center;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 2px 8px rgba(26,20,16,0.06);
  }

  .search-wrap {
    position: relative;
    flex: 1;
    min-width: 220px;
    max-width: 360px;
  }

  .search-wrap svg {
    position: absolute;
    left: 12px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--muted);
    pointer-events: none;
  }

  .search-wrap input {
    width: 100%;
    padding: 10px 12px 10px 38px;
    border: 1.5px solid var(--border);
    border-radius: 6px;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.9rem;
    background: white;
    color: var(--ink);
    outline: none;
    transition: border-color 0.2s;
  }

  .search-wrap input:focus {
    border-color: var(--gold);
  }

  .filter-group {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    align-items: center;
  }

  .filter-label {
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--muted);
    font-weight: 500;
  }

  select, .filter-btn {
    padding: 8px 14px;
    border: 1.5px solid var(--border);
    border-radius: 6px;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.85rem;
    background: white;
    color: var(--ink);
    cursor: pointer;
    outline: none;
    transition: all 0.2s;
  }

  select:focus, .filter-btn:hover {
    border-color: var(--gold);
  }

  .filter-btn.active {
    background: var(--ink);
    border-color: var(--ink);
    color: var(--gold);
  }

  .results-count {
    margin-left: auto;
    font-size: 0.82rem;
    color: var(--muted);
    white-space: nowrap;
    font-weight: 500;
  }

  /* MAIN GRID */
  main {
    padding: 32px 40px;
    max-width: 1600px;
    margin: 0 auto;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(370px, 1fr));
    gap: 24px;
  }

  /* CARD */
  .card {
    background: var(--card-bg);
    border-radius: 10px;
    border: 1px solid var(--border);
    box-shadow: var(--shadow);
    overflow: hidden;
    transition: box-shadow 0.25s, transform 0.25s;
    display: flex;
    flex-direction: column;
    cursor: pointer;
  }

  .card:hover {
    box-shadow: var(--shadow-hover);
    transform: translateY(-2px);
  }

  .card-header {
    padding: 20px 22px 14px;
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 12px;
  }

  .card-title-block {}

  .building-name {
    font-family: 'Playfair Display', serif;
    font-size: 1.2rem;
    font-weight: 700;
    line-height: 1.2;
    color: var(--ink);
  }

  .building-address {
    font-size: 0.8rem;
    color: var(--muted);
    margin-top: 4px;
  }

  .building-address a {
    color: var(--muted);
    text-decoration: none;
    border-bottom: 1px dashed var(--border);
    transition: color 0.2s;
  }

  .building-address a:hover {
    color: var(--gold);
    border-color: var(--gold);
  }

  .card-badge {
    background: var(--tag-bg);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 3px 9px;
    font-size: 0.72rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--muted);
    white-space: nowrap;
    flex-shrink: 0;
  }

  .card-badge.luxury { background: #f7f0e4; color: #8a6020; border-color: #e8d090; }
  .card-badge.highrise { background: #e8f0f8; color: #2a5a8a; border-color: #b0ccec; }
  .card-badge.boutique { background: #e8f4ec; color: #2a5a3a; border-color: #90c4a0; }

  /* QUICK STATS ROW */
  .quick-stats {
    display: flex;
    padding: 12px 22px;
    gap: 0;
    background: var(--warm-white);
    border-bottom: 1px solid var(--border);
  }

  .qs-item {
    flex: 1;
    text-align: center;
    padding: 0 8px;
    border-right: 1px solid var(--border);
  }

  .qs-item:last-child { border-right: none; }

  .qs-val {
    font-family: 'Playfair Display', serif;
    font-size: 1.15rem;
    font-weight: 700;
    color: var(--ink);
    display: block;
    line-height: 1.1;
  }

  .qs-val.gold { color: var(--gold); }

  .qs-key {
    font-size: 0.68rem;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-top: 2px;
    display: block;
  }

  /* CARD BODY */
  .card-body {
    padding: 16px 22px;
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  /* AMENITY TAGS */
  .amenity-row {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }

  .amenity-tag {
    display: flex;
    align-items: center;
    gap: 4px;
    background: var(--tag-bg);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 3px 10px 3px 7px;
    font-size: 0.75rem;
    color: var(--ink);
    font-weight: 500;
  }

  .amenity-tag .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--gold);
    flex-shrink: 0;
  }

  .amenity-tag.no .dot { background: var(--muted); }

  /* CONTACT SECTION */
  .info-section {
    border-top: 1px solid var(--border);
    padding-top: 12px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }

  .info-item {}

  .info-key {
    font-size: 0.68rem;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--muted);
    font-weight: 600;
    display: block;
    margin-bottom: 2px;
  }

  .info-val {
    font-size: 0.85rem;
    color: var(--ink);
    font-weight: 500;
    line-height: 1.3;
  }

  .info-val a {
    color: var(--ink);
    text-decoration: none;
    border-bottom: 1px solid var(--border);
    transition: color 0.2s;
  }

  .info-val a:hover { color: var(--gold); }

  .info-val.missing { color: var(--muted); font-style: italic; font-weight: 400; }

  /* MOVE-IN FEES */
  .fees-row {
    background: var(--tag-bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 10px 14px;
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
  }

  .fee-item {}
  .fee-item .fee-label {
    font-size: 0.68rem;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--muted);
    font-weight: 600;
    display: block;
  }
  .fee-item .fee-val {
    font-size: 0.9rem;
    font-weight: 600;
    color: var(--ink);
    display: block;
    margin-top: 1px;
  }
  .fee-item .fee-val.missing { color: var(--muted); font-weight: 400; font-style: italic; }

  /* NOTES */
  .building-notes {
    font-size: 0.82rem;
    color: var(--muted);
    font-style: italic;
    line-height: 1.5;
    border-left: 2px solid var(--gold-light);
    padding-left: 10px;
  }

  /* VERIFIED STAMP */
  .verified-stamp {
    margin-top: 10px;
    font-size: 0.72rem;
    color: #a8a09a;
    display: flex;
    align-items: center;
    gap: 5px;
  }

  .verified-stamp svg {
    flex-shrink: 0;
    opacity: 0.6;
  }

  .verified-stamp span {
    font-style: italic;
    letter-spacing: 0.02em;
  }

  /* CARD FOOTER */
  .card-footer {
    padding: 12px 22px;
    border-top: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: var(--warm-white);
  }

  .neigh-tag {
    font-size: 0.75rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--muted);
  }

  .edit-note-btn {
    background: none;
    border: 1.5px solid var(--border);
    border-radius: 4px;
    padding: 4px 10px;
    font-size: 0.75rem;
    font-family: 'DM Sans', sans-serif;
    color: var(--muted);
    cursor: pointer;
    transition: all 0.2s;
  }

  .edit-note-btn:hover {
    border-color: var(--gold);
    color: var(--gold);
  }

  /* NO RESULTS */
  .no-results {
    grid-column: 1/-1;
    text-align: center;
    padding: 60px 20px;
    color: var(--muted);
  }

  .no-results p {
    font-family: 'Playfair Display', serif;
    font-size: 1.4rem;
    color: var(--ink);
    margin-bottom: 8px;
  }

  /* ADD BUILDING PANEL */
  .add-building-btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: var(--gold);
    color: var(--ink);
    border: none;
    border-radius: 6px;
    padding: 10px 20px;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.88rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }

  .add-building-btn:hover {
    background: var(--gold-light);
  }

  /* MODAL */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(26,20,16,0.6);
    z-index: 1000;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }

  .modal-overlay.open {
    display: flex;
  }

  .modal {
    background: white;
    border-radius: 12px;
    width: 100%;
    max-width: 680px;
    max-height: 90vh;
    overflow-y: auto;
    box-shadow: 0 20px 60px rgba(26,20,16,0.3);
  }

  .modal-header {
    padding: 24px 28px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
    position: sticky;
    top: 0;
    background: white;
    z-index: 1;
  }

  .modal-header h2 {
    font-family: 'Playfair Display', serif;
    font-size: 1.4rem;
    font-weight: 700;
  }

  .modal-close {
    background: none;
    border: none;
    font-size: 1.5rem;
    cursor: pointer;
    color: var(--muted);
    line-height: 1;
    padding: 4px;
  }

  .modal-body {
    padding: 24px 28px;
    display: flex;
    flex-direction: column;
    gap: 18px;
  }

  .form-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
  }

  .form-row.single { grid-template-columns: 1fr; }

  .form-group {
    display: flex;
    flex-direction: column;
    gap: 5px;
  }

  .form-group label {
    font-size: 0.78rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--muted);
  }

  .form-group input,
  .form-group select,
  .form-group textarea {
    padding: 9px 12px;
    border: 1.5px solid var(--border);
    border-radius: 6px;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.9rem;
    color: var(--ink);
    outline: none;
    transition: border-color 0.2s;
  }

  .form-group input:focus,
  .form-group select:focus,
  .form-group textarea:focus {
    border-color: var(--gold);
  }

  .form-group textarea { resize: vertical; min-height: 80px; }

  .form-section-title {
    font-size: 0.78rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: var(--gold);
    padding-bottom: 8px;
    border-bottom: 1px solid var(--border);
  }

  .checkbox-grid {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 8px;
  }

  .check-item {
    display: flex;
    align-items: center;
    gap: 7px;
    font-size: 0.85rem;
    cursor: pointer;
  }

  .check-item input { width: 14px; height: 14px; accent-color: var(--gold); }

  .modal-footer {
    padding: 16px 28px 24px;
    display: flex;
    gap: 12px;
    justify-content: flex-end;
    border-top: 1px solid var(--border);
  }

  .btn-cancel {
    padding: 10px 20px;
    border: 1.5px solid var(--border);
    border-radius: 6px;
    background: white;
    color: var(--muted);
    font-family: 'DM Sans', sans-serif;
    font-size: 0.88rem;
    cursor: pointer;
    transition: all 0.2s;
  }

  .btn-cancel:hover { border-color: var(--muted); color: var(--ink); }

  .btn-save {
    padding: 10px 24px;
    background: var(--ink);
    color: var(--gold);
    border: none;
    border-radius: 6px;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.88rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }

  .btn-save:hover { background: var(--gold); color: var(--ink); }

  /* DOORMAN INDICATOR */
  .doorman-yes { color: var(--green); }
  .doorman-no { color: var(--red); }

  @media (max-width: 768px) {
    header { padding: 20px; }
    .controls-bar { padding: 14px 20px; }
    main { padding: 20px; }
    .grid { grid-template-columns: 1fr; }
    .form-row { grid-template-columns: 1fr; }
    .header-stats { display: none; }
  }
</style>
</head>
<body>

<header>
  <div class="logo-block">
    <h1>The Building <span>Dossier</span></h1>
    <p class="logo-sub">Verified Intelligence for Philadelphia Real Estate Professionals</p>
    <p class="logo-brand">By The Curated Advantage</p>
  </div>
  <div class="header-stats">
    <div class="stat-pill">
      <span class="num" id="totalBuildings">0</span>
      <span class="label">Buildings</span>
    </div>
    <div class="stat-pill">
      <span class="num" id="totalUnits">0</span>
      <span class="label">Total Units</span>
    </div>
    <div class="stat-pill">
      <span class="num" id="doormanCount">0</span>
      <span class="label">24/7 Doorman</span>
    </div>
  </div>
</header>

<div class="controls-bar">
  <div class="search-wrap">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
    <input type="text" id="searchInput" placeholder="Search by name, address, neighborhood…">
  </div>

  <div class="filter-group">
    <span class="filter-label">Hood:</span>
    <select id="hoodFilter">
      <option value="">All</option>
      <option>Rittenhouse Square</option>
      <option>Avenue of the Arts</option>
      <option>Avenue of the Arts South</option>
      <option>Logan Square</option>
      <option>Logan Square / Fairmount</option>
      <option>Logan Square / Spring Garden</option>
      <option>Washington Square West</option>
      <option>Old City</option>
      <option>Old City / Waterfront</option>
      <option>Fairmount/Art Museum</option>
      <option>Fairmount / Art Museum</option>
      <option>Northern Liberties</option>
      <option>Northern Liberties / Fairmount</option>
      <option>Society Hill</option>
      <option>Center City West</option>
      <option>Center City / Rittenhouse</option>
      <option>Center City / Midtown Village</option>
      <option>Spring Garden</option>
      <option>Spring Garden / Fairmount</option>
      <option>Graduate Hospital</option>
      <option>Point Breeze / Graduate Hospital</option>
      <option>University City</option>
      <option>Midtown Village</option>
      <option>Chinatown / Washington Sq West</option>
    </select>
  </div>

  <div class="filter-group">
    <span class="filter-label">Filter:</span>
    <button class="filter-btn" data-filter="doorman" id="doormanBtn">24/7 Doorman</button>
    <button class="filter-btn" data-filter="pool" id="poolBtn">Pool</button>
    <button class="filter-btn" data-filter="parking" id="parkingBtn">Parking</button>
  </div>

  <button class="add-building-btn" onclick="openAddModal()">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M5 12h14"/></svg>
    Add Building
  </button>

  <span class="results-count" id="resultsCount"></span>
</div>

<main>
  <div class="grid" id="buildingGrid"></div>
</main>

<!-- ADD BUILDING MODAL -->
<div class="modal-overlay" id="addModal">
  <div class="modal">
    <div class="modal-header">
      <h2 id="modalTitle">Add New Building</h2>
      <button class="modal-close" onclick="closeModal()">×</button>
    </div>
    <div class="modal-body">
      <div class="form-section-title">Basic Info</div>
      <div class="form-row">
        <div class="form-group">
          <label>Building Name *</label>
          <input type="text" id="f_name" placeholder="The Moravian">
        </div>
        <div class="form-group">
          <label>Neighborhood</label>
          <select id="f_neighborhood">
            <option value="">Select…</option>
            <option>Rittenhouse Square</option>
            <option>Avenue of the Arts</option>
            <option>Logan Square</option>
            <option>Washington Square West</option>
            <option>Old City</option>
            <option>Fairmount/Art Museum</option>
            <option>Northern Liberties</option>
            <option>Society Hill</option>
            <option>Center City West</option>
          </select>
        </div>
      </div>
      <div class="form-row single">
        <div class="form-group">
          <label>Full Address *</label>
          <input type="text" id="f_address" placeholder="1234 Walnut St, Philadelphia, PA 19103">
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Total Units</label>
          <input type="number" id="f_units" placeholder="e.g. 209">
        </div>
        <div class="form-group">
          <label>Number of Floors</label>
          <input type="number" id="f_floors" placeholder="e.g. 31">
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Year Built</label>
          <input type="number" id="f_year" placeholder="e.g. 2007">
        </div>
        <div class="form-group">
          <label>Building Type</label>
          <select id="f_type">
            <option value="">Select…</option>
            <option value="luxury">Luxury High-Rise</option>
            <option value="highrise">High-Rise</option>
            <option value="boutique">Boutique/Mid-Rise</option>
          </select>
        </div>
      </div>

      <div class="form-section-title">Management & HOA</div>
      <div class="form-row">
        <div class="form-group">
          <label>Management Company</label>
          <input type="text" id="f_mgmt" placeholder="e.g. Allan Domb Real Estate">
        </div>
        <div class="form-group">

// Paste your Apps Script Web App URL below after deploying
const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxXNXPUMJrBIF_SP5rmgxx9CbYQUGocR3ZY5V4L61TlUe7Wg2R6S3ZImaSc7BZV16tCnA/exec';

// ===== STATE =====
let buildings = [];
let activeFilters = new Set();
let editingId = null;
let usingSheets = false; // flips to true once Apps Script URL is set

// ===== INIT =====
function init() {
  document.getElementById('searchInput').addEventListener('input', render);
  document.getElementById('hoodFilter').addEventListener('change', render);

  if (APPS_SCRIPT_URL && APPS_SCRIPT_URL !== 'PASTE_YOUR_APPS_SCRIPT_URL_HERE') {
    usingSheets = true;
    loadFromSheets();
  } else {
    // Fallback: localStorage (single-user mode)
    loadFromLocal();
  }
}

// ── Google Sheets mode ───────────────────────────────────────
function loadFromSheets() {
  showLoadingState(true);
  fetch(APPS_SCRIPT_URL)
    .then(r => r.json())
    .then(data => {
      if (data.status === 'ok') {
        buildings = data.buildings;
        updateStats();
        render();
      } else {
        console.error('Sheets error:', data.message);
        showBanner('Could not load from Google Sheets. Showing local data.', 'warn');
        loadFromLocal();
      }
    })
    .catch(err => {
      console.error('Fetch error:', err);
      showBanner('Could not reach Google Sheets. Showing local data.', 'warn');
      loadFromLocal();
    })
    .finally(() => showLoadingState(false));
}

function saveToSheets(building, isNew) {
  const action = isNew ? 'add' : 'update';
  return fetch(APPS_SCRIPT_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain' },
    body: JSON.stringify({ action, building })
  })
  .then(r => r.json())
  .then(data => {
    if (data.status !== 'ok') throw new Error(data.message);
    return data;
  });
}

// ── Local fallback mode ──────────────────────────────────────
function loadFromLocal() {
  const stored = localStorage.getItem('phillyBuildingIntel');
  const storedVersion = localStorage.getItem('phillyBuildingIntel_version');
  const storedData = stored ? JSON.parse(stored) : null;
  const DATA_VERSION = '2.0';

  if (!storedData || storedVersion !== DATA_VERSION || storedData.length < SEED_BUILDINGS.length) {
    const userAdded = storedData ? storedData.filter(b => b.id > SEED_BUILDINGS.length) : [];
    buildings = JSON.parse(JSON.stringify(SEED_BUILDINGS)).concat(userAdded);
    saveLocal();
  } else {
    buildings = storedData;
  }
  updateStats();
  render();
}

function saveLocal() {
  localStorage.setItem('phillyBuildingIntel', JSON.stringify(buildings));
  localStorage.setItem('phillyBuildingIntel_version', '2.0');
}

// ── Generic save (routes to Sheets or local) ────────────────
function save() {
  if (!usingSheets) saveLocal();
  // Sheets save happens in saveBuilding() directly
}

// ── UI helpers ───────────────────────────────────────────────
function showLoadingState(on) {
  const grid = document.getElementById('buildingGrid');
  if (on) {
    grid.innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:60px;color:var(--muted);font-style:italic;font-family:'Playfair Display',serif;font-size:1.1rem;">Loading buildings from Google Sheets…</div>';
  }
}

function showBanner(msg, type) {
  const existing = document.getElementById('syncBanner');
  if (existing) existing.remove();
  const banner = document.createElement('div');
  banner.id = 'syncBanner';
  banner.style.cssText = `position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:${type === 'warn' ? '#7a5c00' : '#2e6b2e'};color:#fff;padding:10px 20px;border-radius:8px;font-size:0.82rem;font-family:Arial,sans-serif;z-index:9999;box-shadow:0 4px 16px rgba(0,0,0,0.3);`;
  banner.textContent = msg;
  document.body.appendChild(banner);
  setTimeout(() => banner.remove(), 4000);
}

// ===== STATS =====
function updateStats() {
  document.getElementById('totalBuildings').textContent = buildings.length;
  const totalUnits = buildings.reduce((s, b) => s + (b.units || 0), 0);
  document.getElementById('totalUnits').textContent = totalUnits.toLocaleString();
  const doorman = buildings.filter(b => b.amenities.doorman).length;
  document.getElementById('doormanCount').textContent = doorman;
}

// ===== RENDER =====
function render() {
  const query = document.getElementById('searchInput').value.toLowerCase();
  const hood = document.getElementById('hoodFilter').value;

  const filtered = buildings.filter(b => {
    const textMatch = !query || [b.name, b.address, b.neighborhood, b.mgmt, b.hoaName, b.notes]
      .join(' ').toLowerCase().includes(query);
    const hoodMatch = !hood || b.neighborhood === hood;
    const filterMatch = [...activeFilters].every(f => {
      if (f === 'doorman') return b.amenities.doorman;
      if (f === 'pool') return b.amenities.pool || b.amenities.pool_indoor;
      if (f === 'parking') return b.amenities.parking || b.amenities.valet;
      return true;
    });
    return textMatch && hoodMatch && filterMatch;
  });

  document.getElementById('resultsCount').textContent =
    filtered.length === buildings.length
      ? `${buildings.length} buildings`
      : `${filtered.length} of ${buildings.length} buildings`;

  const grid = document.getElementById('buildingGrid');
  if (filtered.length === 0) {
    grid.innerHTML = `<div class="no-results"><p>No buildings found.</p><span>Try adjusting your search or filters.</span></div>`;
    return;
  }
  grid.innerHTML = filtered.map(b => buildCard(b)).join('');
}

function amenityTag(label, active) {
  return `<span class="amenity-tag${active ? '' : ' no'}"><span class="dot"></span>${label}</span>`;
}

function buildCard(b) {
  const a = b.amenities;

  const mainAmenities = [
    { key: 'doorman', label: '24/7 Doorman' },
    { key: 'concierge', label: 'Concierge' },
    { key: 'pool', label: 'Pool' },
    { key: 'pool_indoor', label: 'Indoor Pool' },
    { key: 'parking', label: 'Parking' },
    { key: 'valet', label: 'Valet' },
    { key: 'gym', label: 'Gym' },
    { key: 'rooftop', label: 'Rooftop' },
    { key: 'pets', label: 'Pet Friendly' },
    { key: 'shuttle', label: 'Shuttle' },
    { key: 'balcony', label: 'Balconies' },
    { key: 'storage', label: 'Storage' },
  ].filter(x => a[x.key]);

  const badgeClass = b.type || 'highrise';
  const badgeLabel = b.type === 'luxury' ? 'Luxury' : b.type === 'boutique' ? 'Boutique' : 'High-Rise';

  const mapUrl = `https://maps.google.com/?q=${encodeURIComponent(b.address)}`;

  return `
  <div class="card" id="card-${b.id}">
    <div class="card-header">
      <div class="card-title-block">
        <div class="building-name">${b.name}</div>
        <div class="building-address">
          <a href="${mapUrl}" target="_blank" rel="noopener">${b.address}</a>
        </div>
      </div>
      <span class="card-badge ${badgeClass}">${badgeLabel}</span>
    </div>

    <div class="quick-stats">
      <div class="qs-item">
        <span class="qs-val">${b.units ? b.units.toLocaleString() : '—'}</span>
        <span class="qs-key">Units</span>
      </div>
      <div class="qs-item">
        <span class="qs-val">${b.floors ? b.floors : '—'}</span>
        <span class="qs-key">Floors</span>
      </div>
      <div class="qs-item">
        <span class="qs-val">${b.yearBuilt || '—'}</span>
        <span class="qs-key">Built</span>
      </div>
      <div class="qs-item">
        <span class="qs-val ${a.doorman ? 'doorman-yes' : 'doorman-no'}">${a.doorman ? '✓' : '✗'}</span>
        <span class="qs-key">Doorman</span>
      </div>
    </div>

    <div class="card-body">

      ${mainAmenities.length > 0 ? `
      <div class="amenity-row">
        ${mainAmenities.map(x => amenityTag(x.label, true)).join('')}
      </div>` : ''}

      <div class="fees-row">
        <div class="fee-item">
          <span class="fee-label">Move-In Fee</span>
          <span class="fee-val${!b.moveInFee ? ' missing' : ''}">${b.moveInFee || 'Unknown — add'}</span>
        </div>
        <div class="fee-item">
          <span class="fee-label">Move-Out Fee</span>
          <span class="fee-val${!b.moveOutFee ? ' missing' : ''}">${b.moveOutFee || 'Unknown — add'}</span>
        </div>
        ${b.elevatorDeposit ? `<div class="fee-item"><span class="fee-label">Elevator Deposit</span><span class="fee-val">${b.elevatorDeposit}</span></div>` : ''}
        ${b.moveWindow ? `<div class="fee-item"><span class="fee-label">Move Window</span><span class="fee-val">${b.moveWindow}</span></div>` : ''}
      </div>

      <div class="info-section">
        <div class="info-item">
          <span class="info-key">Management Co.</span>
          <span class="info-val${!b.mgmt ? ' missing' : ''}">${b.mgmt || 'Add management company'}</span>
        </div>
        <div class="info-item">
          <span class="info-key">HOA / Assoc.</span>
          <span class="info-val${!b.hoaName ? ' missing' : ''}">${b.hoaName || 'Add HOA name'}</span>
        </div>
        <div class="info-item">
          <span class="info-key">Contact</span>
          <span class="info-val${!b.contact ? ' missing' : ''}">${b.contact || '—'}</span>
        </div>
        <div class="info-item">
          <span class="info-key">Phone</span>
          <span class="info-val${!b.phone ? ' missing' : ''}">
            ${b.phone ? `<a href="tel:${b.phone.replace(/\D/g,'')}">${b.phone}</a>` : '— add phone'}
          </span>
        </div>
        ${b.email ? `<div class="info-item" style="grid-column:1/-1">
          <span class="info-key">Email</span>
          <span class="info-val"><a href="mailto:${b.email}">${b.email}</a></span>
        </div>` : ''}
      </div>

      ${b.notes ? `<div class="building-notes">${b.notes}</div>` : ''}

      ${ (b.verifiedBy || b.verifiedDate) ? '<div class="verified-stamp"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg><span>Last verified' + (b.verifiedBy ? ' by ' + b.verifiedBy : '') + (b.verifiedDate ? ' — ' + b.verifiedDate : '') + '</span></div>' : '' }

    </div>

    <div class="card-footer">
      <span class="neigh-tag">${b.neighborhood || 'Center City'}</span>
      <button class="edit-note-btn" onclick="openEditModal(${b.id})">Edit</button>
    </div>
  </div>`;
}

// ===== FILTERS =====
document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    const f = btn.dataset.filter;
    if (activeFilters.has(f)) {
      activeFilters.delete(f);
      btn.classList.remove('active');
    } else {
      activeFilters.add(f);
      btn.classList.add('active');
    }
    render();
  });
});

// ===== MODAL =====
function openAddModal() {
  editingId = null;
  document.getElementById('modalTitle').textContent = 'Add New Building';
  clearForm();
  document.getElementById('addModal').classList.add('open');
}

function openEditModal(id) {
  editingId = id;
  const b = buildings.find(x => x.id === id);
  if (!b) return;

  document.getElementById('modalTitle').textContent = `Edit: ${b.name}`;
  document.getElementById('f_name').value = b.name || '';
  document.getElementById('f_neighborhood').value = b.neighborhood || '';
  document.getElementById('f_address').value = b.address || '';
  document.getElementById('f_units').value = b.units || '';
  document.getElementById('f_floors').value = b.floors || '';
  document.getElementById('f_year').value = b.yearBuilt || '';
  document.getElementById('f_type').value = b.type || '';
  document.getElementById('f_mgmt').value = b.mgmt || '';
  document.getElementById('f_hoa_name').value = b.hoaName || '';
  document.getElementById('f_contact').value = b.contact || '';
  document.getElementById('f_phone').value = b.phone || '';
  document.getElementById('f_email').value = b.email || '';
  document.getElementById('f_movein').value = b.moveInFee || '';
  document.getElementById('f_moveout').value = b.moveOutFee || '';
  document.getElementById('f_window').value = b.moveWindow || '';
  document.getElementById('f_elevator').value = b.elevatorDeposit || '';
  document.getElementById('f_notes').value = b.notes || '';
  document.getElementById('f_verified_by').value = b.verifiedBy || '';
  document.getElementById('f_verified_date').value = b.verifiedDate || '';

  const amenityMap = {
    doorman: 'a_doorman', concierge: 'a_concierge', gym: 'a_gym',
    pool: 'a_pool', pool_indoor: 'a_pool_indoor', parking: 'a_parking',
    valet: 'a_valet', rooftop: 'a_rooftop', pets: 'a_pets',
    package: 'a_package', laundry: 'a_laundry', storage: 'a_storage',
    bike: 'a_bike', shuttle: 'a_shuttle', balcony: 'a_balcony'
  };
  Object.entries(amenityMap).forEach(([key, elId]) => {
    document.getElementById(elId).checked = !!(b.amenities && b.amenities[key]);
  });

  document.getElementById('addModal').classList.add('open');
}

function closeModal() {
  document.getElementById('addModal').classList.remove('open');
  editingId = null;
}

function clearForm() {
  ['f_name','f_neighborhood','f_address','f_units','f_floors','f_year','f_type',
   'f_mgmt','f_hoa_name','f_contact','f_phone','f_email',
   'f_movein','f_moveout','f_window','f_elevator','f_notes',
   'f_verified_by','f_verified_date'].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.value = '';
  });
  ['a_doorman','a_concierge','a_gym','a_pool','a_pool_indoor','a_parking',
   'a_valet','a_rooftop','a_pets','a_package','a_laundry','a_storage',
   'a_bike','a_shuttle','a_balcony'].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.checked = false;
  });
}

function saveBuilding() {
  const name = document.getElementById('f_name').value.trim();
  const address = document.getElementById('f_address').value.trim();
  if (!name || !address) {
    alert('Building name and address are required.');
    return;
  }

  const data = {
    name,
    address,
    neighborhood: document.getElementById('f_neighborhood').value,
    units: parseInt(document.getElementById('f_units').value) || null,
    floors: parseInt(document.getElementById('f_floors').value) || null,
    yearBuilt: parseInt(document.getElementById('f_year').value) || null,
    type: document.getElementById('f_type').value,
    mgmt: document.getElementById('f_mgmt').value.trim(),
    hoaName: document.getElementById('f_hoa_name').value.trim(),
    contact: document.getElementById('f_contact').value.trim(),
    phone: document.getElementById('f_phone').value.trim(),
    email: document.getElementById('f_email').value.trim(),
    moveInFee: document.getElementById('f_movein').value.trim(),
    moveOutFee: document.getElementById('f_moveout').value.trim(),
    moveWindow: document.getElementById('f_window').value.trim(),
    elevatorDeposit: document.getElementById('f_elevator').value.trim(),
    notes: document.getElementById('f_notes').value.trim(),
    verifiedBy: document.getElementById('f_verified_by').value.trim(),
    verifiedDate: document.getElementById('f_verified_date').value.trim(),
    amenities: {
      doorman: document.getElementById('a_doorman').checked,
      concierge: document.getElementById('a_concierge').checked,
      gym: document.getElementById('a_gym').checked,
      pool: document.getElementById('a_pool').checked,
      pool_indoor: document.getElementById('a_pool_indoor').checked,
      parking: document.getElementById('a_parking').checked,
      valet: document.getElementById('a_valet').checked,
      rooftop: document.getElementById('a_rooftop').checked,
      pets: document.getElementById('a_pets').checked,
      package: document.getElementById('a_package').checked,
      laundry: document.getElementById('a_laundry').checked,
      storage: document.getElementById('a_storage').checked,
      bike: document.getElementById('a_bike').checked,
      shuttle: document.getElementById('a_shuttle').checked,
      balcony: document.getElementById('a_balcony').checked
    }
  };

  const isNew = editingId === null;

  if (!isNew) {
    const idx = buildings.findIndex(b => b.id === editingId);
    if (idx > -1) {
      data.id = editingId;
      buildings[idx] = { ...buildings[idx], ...data };
    }
  } else {
    data.id = Date.now();
    buildings.push(data);
  }

  // Update UI immediately (optimistic)
  updateStats();
  render();
  closeModal();

  if (usingSheets) {
    // Save to Google Sheets
    const btn = document.querySelector('.btn-save');
    if (btn) { btn.textContent = 'Saving…'; btn.disabled = true; }

    saveToSheets(data, isNew)
      .then(() => showBanner('Saved to Google Sheets ✓', 'success'))
      .catch(err => {
        showBanner('Sheets save failed — saved locally as backup', 'warn');
        saveLocal();
        console.error(err);
      })
      .finally(() => {
        if (btn) { btn.textContent = 'Save Building'; btn.disabled = false; }
      });
  } else {
    saveLocal();
  }
}

// Close on overlay click
document.getElementById('addModal').addEventListener('click', function(e) {
  if (e.target === this) closeModal();
});

// ===== GO =====
init();
</script>
</body>
</html>
